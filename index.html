<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Planting Guide Naija</title>
  <meta name="description" content="Simple planting guide for Nigerian farmers. Works offline.">
  <meta name="theme-color" content="#0a9a3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@700&display=swap');
:root{--g1:#0a9a3f;--g2:#067a31;--deep:#0c3b20;--lime:#b8f26a;--cream:#f1f9ea;--ink:#12301c;--muted:#5d7566;--card:#fff;--line:#dcebd6;--r:22px;--sh:0 12px 28px -14px rgba(8,80,36,.45);--max:480px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,#d9f5c9,#bfe8b0 60%,#a7dc9a);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#app{height:100%}
a{color:var(--g1)}

/* ---------- shell ---------- */
.shell{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);display:flex;flex-direction:column;background:var(--cream);box-shadow:0 0 60px rgba(0,60,20,.25)}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;background:linear-gradient(135deg,#0fb04a,#067a31);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 8px 24px -10px rgba(5,90,35,.7);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:25px;font-weight:900;letter-spacing:-.4px}
.logo{display:grid;place-items:center;animation:sway 4s ease-in-out infinite;transform-origin:50% 90%}
.logo svg{width:32px;height:32px}
@keyframes sway{50%{transform:rotate(8deg)}}
.top-r{display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:#ffd43b;border:2px solid #0b9a3f}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--g2);font-weight:900;font-size:18px}
.view{flex:1;overflow-y:auto;padding:18px 18px 110px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.enter>*{animation:rise .5s both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.nav{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-around;background:#fff;border-radius:26px;padding:8px 6px;box-shadow:0 14px 34px -10px rgba(6,70,30,.45);z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:18px;color:#7a8f80;font-size:11.5px;font-weight:800;transition:.25s}
.nav button svg{transition:.25s}
.nav button.on{color:var(--g1)}
.nav button.on svg{transform:translateY(-3px) scale(1.12)}
.nav button.on span{color:var(--g1)}
.nav button.on::after{content:'';width:18px;height:4px;border-radius:4px;background:var(--g1);margin-top:1px}

/* ---------- home ---------- */
.greet h2{font-size:30px;font-weight:900;color:var(--deep);letter-spacing:-.5px}
.greet p{margin-top:4px;color:#365b43;font-size:13.5px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;margin:16px 0 14px;padding:0 16px;height:54px;border-radius:18px;background:#fff;border:2px solid #cfe5c7;color:var(--muted);transition:.2s}
.search:focus-within{border-color:var(--g1);box-shadow:0 0 0 5px rgba(10,154,63,.14)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.farmcard{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;text-align:left;background:linear-gradient(120deg,#0c3b20,#0e7a37);color:#fff;box-shadow:var(--sh);margin-bottom:14px;position:relative;overflow:hidden}
.farmcard::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(184,242,106,.18)}
.farmcard.empty{background:linear-gradient(120deg,#e9f7d8,#d3efba);color:var(--deep)}
.fc-ico{font-size:32px}
.farmcard div{flex:1;min-width:0}
.farmcard b{display:block;font-size:15px;font-weight:800}
.farmcard small{display:block;opacity:.85;font-size:12.5px;margin-top:2px}
.farmcard em{font-style:normal;font-weight:800;font-size:13px;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:12px;white-space:nowrap}
.farmcard.empty em{background:#0a9a3f;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:9px 15px;border-radius:30px;background:#fff;border:2px solid #d3e7cc;font-weight:800;font-size:13.5px;color:#2e5a3d;transition:.2s}
.chip.on{background:var(--g1);border-color:var(--g1);color:#fff;box-shadow:0 6px 14px -6px var(--g1)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 12px}
.sec h2{font-size:21px;font-weight:900;color:var(--deep)}
.count{font-size:13px;font-weight:700;color:var(--g1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccard{background:#fff;border-radius:24px;padding:10px 10px 14px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s;animation:rise .5s both}
.ccard:active{transform:scale(.96)}
.ccard:nth-child(2n){animation-delay:.06s}.ccard:nth-child(3n){animation-delay:.1s}
.phwrap{position:relative;width:100%}
.badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);color:var(--g2);font-size:11px;font-weight:900;padding:4px 9px;border-radius:12px;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ccard h3{font-size:20px;font-weight:900;color:var(--deep);margin-top:4px}
.ccard p{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800;background:#e5f6d9;color:#237a37}
.pill.medium{background:#fff1c9;color:#946200}
.pill.ready{background:#ffe3d3;color:#c2410c}
.photo{position:relative;overflow:hidden;aspect-ratio:1/1;width:100%;border-radius:18px;background:linear-gradient(110deg,var(--g1),var(--g2));background-size:200% 100%}
.photo:not(.nophoto){animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .6s}
.photo img.in{opacity:1}
.ccard:hover .photo img{transform:scale(1.06)}
.photo.nophoto{animation:none;display:grid;place-items:center}
.photo.nophoto::after{content:attr(data-emoji);font-size:56px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.photo.sm{width:62px;height:62px;border-radius:16px;flex:none}
.photo.sm.nophoto::after{font-size:30px}
.photo.hero{aspect-ratio:auto;height:100%;border-radius:0}
.tipbar{display:flex;gap:10px;align-items:center;margin-top:18px;padding:13px 15px;background:#d6f0bf;border-radius:16px;font-size:14px;font-weight:700;color:#1b5a2d}
.tipbar span{font-size:20px}
.empty{grid-column:1/-1;text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty span{display:block;font-size:42px;margin-bottom:6px}
.empty.big{padding:50px 20px}

/* ---------- guide / pages ---------- */
.pagehead h2{font-size:28px;font-weight:900;color:var(--deep)}
.pagehead p{color:var(--muted);font-weight:600;margin:3px 0 14px}
.seasoncard{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:22px;background:linear-gradient(120deg,#0fb04a,#0a7d36);color:#fff;margin-bottom:12px;box-shadow:var(--sh)}
.seasoncard small{opacity:.85;font-weight:700}.seasoncard b{display:block;font-size:24px;font-weight:900}.seasoncard span{font-size:44px}
.chip.crop{background:#fff}
.acc details{background:#fff;border-radius:18px;margin-bottom:10px;box-shadow:0 6px 16px -12px rgba(8,80,36,.5);overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:800;font-size:15.5px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{width:38px;height:38px;border-radius:12px;background:#e8f7da;display:grid;place-items:center;font-size:20px}
.acc summary::after{content:'+';margin-left:auto;font-size:22px;color:var(--g1);transition:.2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc ul{margin:0;padding:0 18px 16px 52px;color:#345a41;font-weight:600;font-size:14.5px;line-height:1.55}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;background:#fff;padding:10px 14px 10px 10px;border-radius:18px;text-align:left;text-decoration:none;color:inherit;box-shadow:0 6px 16px -12px rgba(8,80,36,.5)}
.lrow div{flex:1;min-width:0}.lrow b{display:block;font-size:16px;font-weight:800}.lrow small{color:var(--muted);font-weight:600;font-size:12.5px}
.lrow em{font-style:normal;font-size:22px;color:var(--g1);font-weight:800}
.srcico{width:46px;height:46px;border-radius:14px;background:#e8f7da;display:grid;place-items:center;font-size:24px;flex:none}

/* ---------- overlay / detail ---------- */
.overlay,.sheet{position:fixed;inset:0;left:50%;width:100%;max-width:var(--max);pointer-events:none;z-index:20}
.overlay{transform:translate(calc(-50% + 40px),0);opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);background:var(--cream)}
.overlay.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.detail{height:100%;overflow-y:auto;padding-bottom:104px;scrollbar-width:none}
.detail::-webkit-scrollbar{display:none}
.dhero{position:relative;height:290px;border-radius:0 0 34px 34px;overflow:hidden;background:#cde}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,30,10,.78),rgba(0,30,10,0) 60%)}
.roundbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--deep);box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
.dtitle{position:absolute;left:18px;right:18px;bottom:18px;color:#fff;z-index:2}
.dtitle h2{font-size:36px;font-weight:900;letter-spacing:-.6px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.meta span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:800}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:12px 14px;background:rgba(241,249,234,.94);backdrop-filter:blur(8px);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;padding:10px 12px;border-radius:14px;font-weight:800;font-size:13.5px;background:#fff;color:#2e5a3d;border:2px solid #d3e7cc;transition:.2s}
.tabs button.on{background:var(--g1);color:#fff;border-color:var(--g1);box-shadow:0 6px 14px -6px var(--g1)}
.dbody{padding:6px 18px 10px}
.dbody.swap>*{animation:rise .4s both}
.irows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.irow{display:flex;gap:14px;align-items:center;background:#fff;padding:13px 14px;border-radius:18px;box-shadow:0 6px 16px -12px rgba(8,80,36,.5)}
.irow .ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#e8f7da}
.ico.brown{background:#f3e3cf}.ico.blue{background:#dbeafe}.ico.purple{background:#ece3fb}.ico.sky{background:#d6f1fb}.ico.yellow{background:#fff0bd}.ico.red{background:#ffe1de}.ico.green{background:#dff5cf}
.irow small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.irow b{display:block;font-size:16px;font-weight:800;line-height:1.3;color:var(--deep)}
.h3{font-size:18px;font-weight:900;margin:20px 0 10px;color:var(--deep)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
.steps li{counter-increment:s;position:relative;background:#fff;border-radius:16px;padding:12px 14px 12px 52px;font-weight:600;font-size:14.5px;line-height:1.45}
.steps li::before{content:counter(s);position:absolute;left:12px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--g1);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.note{margin-top:16px;background:#fff6d6;border-radius:16px;padding:13px 15px;font-weight:700;font-size:14px;color:#6b4e00;line-height:1.45}
.seasonrow{display:flex;gap:10px}
.seasonrow span{flex:1;text-align:center;padding:14px;border-radius:18px;background:#eef2ea;color:#9aa89c;font-weight:900;opacity:.7}
.seasonrow span.yes{background:linear-gradient(135deg,#0fb04a,#0a7d36);color:#fff;opacity:1;box-shadow:var(--sh)}
.seasonrow small{font-weight:700;opacity:.85}
.muted{color:var(--muted);font-weight:600}.small{font-size:12.5px}.center{text-align:center;margin-top:12px}
.fig{margin:0 0 20px}
.svgwrap{background:#fffdf4;border:2px solid #e4d9b8;border-radius:22px;padding:8px;box-shadow:var(--sh)}
.svgwrap svg{display:block;width:100%;height:auto}
.fig figcaption{padding:10px 6px 0;font-weight:600;color:#345a41;font-size:14.5px;line-height:1.4}
.fig figcaption b{display:block;font-size:16.5px;color:var(--deep);font-weight:900}
.ready{display:flex;gap:14px;align-items:center;padding:16px;background:linear-gradient(120deg,#ffe9a8,#ffd166);border-radius:20px}
.ready span{font-size:36px}.ready small{font-weight:800;color:#7a5200}.ready b{display:block;font-size:24px;font-weight:900;color:#4d3300}.ready em{font-style:normal;font-weight:700;color:#7a5200;font-size:13px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px dashed #9ed18a;display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;padding-left:16px}
.timeline li::before{content:'';position:absolute;left:-23px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--g1);border:3px solid var(--cream)}
.timeline b{display:block;color:var(--g2);font-weight:900;font-size:13.5px}.timeline span{font-weight:700;font-size:15px}
.bul{margin:0;padding-left:20px;font-weight:600;line-height:1.6;font-size:14.5px}
.bul li::marker{color:var(--g1)}
.dbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--max);display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--cream) 70%,rgba(241,249,234,0));z-index:5}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:18px;background:linear-gradient(135deg,#0fb04a,#067a31);color:#fff;font-weight:900;font-size:15px;box-shadow:0 10px 20px -10px #067a31;transition:.2s}
.btn:active{transform:scale(.97)}
.btn.big{width:100%;padding:15px 18px;font-size:16px}
.btn.water{background:linear-gradient(135deg,#1c9bef,#0b6fc2);box-shadow:0 10px 20px -10px #0b6fc2;flex:1}
.btn.ghost{background:#fff;color:var(--g2);border:2px solid #cfe5c7;box-shadow:none;width:auto;flex:none}
.btn.ghost.red{color:#c2362b;border-color:#f1cfcb;width:100%;margin-top:16px}
.dbar .btn.big{width:auto;white-space:nowrap;font-size:15px;padding:15px 14px}
.dbar .btn.water{flex:1}

/* ---------- sheet ---------- */
.sheet.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(5,30,15,.5);opacity:0;transition:.3s}
.sheet.open .backdrop{opacity:1}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:.35s cubic-bezier(.2,.9,.2,1)}
.sheet.open .panel{transform:none}
.grab{display:block;width:44px;height:5px;border-radius:5px;background:#d5ddd3;margin:0 auto 14px}
.sheeth{font-size:21px;font-weight:900;margin-bottom:6px;color:var(--deep)}
form .btn{margin-top:14px}
.toggle,.sel{display:flex;align-items:center;gap:12px;background:#f3f8ef;border-radius:16px;padding:12px 14px;margin-top:10px;font-weight:800}
.toggle span,.sel span{flex:1}
.toggle input[type=checkbox]{width:22px;height:22px;accent-color:var(--g1)}
.toggle input[type=time],.sel select,.sel input{border:2px solid #d3e7cc;border-radius:12px;padding:8px 10px;background:#fff;font-weight:700;outline:0}
.sel.inline{margin:0;flex:1}
.remrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.remrow span{font-size:28px}.remrow div{flex:1}.remrow b{display:block}.remrow small{color:var(--muted);font-weight:700}
.x{width:34px;height:34px;border-radius:50%;background:#ffe1de;color:#c2362b;font-weight:900}

/* ---------- farm ---------- */
.page{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 110px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.phead h2{font-size:26px;font-weight:900;color:var(--deep)}
.phead .roundbtn{position:static;background:#fff}
.farmlist{display:flex;flex-direction:column;gap:12px}
.fcard{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--sh);animation:rise .4s both}
.fcard.done{opacity:.75}
.fhead{display:flex;gap:12px;align-items:center}
.fhead b{display:block;font-size:18px;font-weight:900}.fhead small{display:block;color:var(--muted);font-weight:700;margin-bottom:4px}
.bar{height:12px;border-radius:12px;background:#e5f0df;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#7ed957,#0fb04a);animation:grow 1s .2s both}
@keyframes grow{from{width:0!important}}
.fmeta{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;color:var(--muted)}
.fmeta b{color:var(--deep)}
.fbtns{display:flex;gap:8px;margin-top:12px}
.fbtns button{flex:1;padding:10px;border-radius:14px;background:#e8f7da;font-weight:800;font-size:13.5px;color:#1b5a2d}
.fbtns .del{flex:none;background:#ffe9e6;color:#c2362b}
.fab{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);padding:15px 26px;border-radius:30px;background:linear-gradient(135deg,#0fb04a,#067a31);color:#fff;font-weight:900;font-size:16px;box-shadow:0 14px 26px -10px #067a31;z-index:3}

/* ---------- weather / news / profile ---------- */
.wxbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.wxbar .sel.inline{min-width:0}.wxbar .sel select{min-width:0;width:100%;max-width:130px}.wxbar .chip{flex:none;white-space:nowrap;padding:9px 12px}
.skeleton{height:220px;border-radius:24px;background:linear-gradient(100deg,#e3efdc 30%,#f3faee 50%,#e3efdc 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.wxnow{display:flex;justify-content:space-between;align-items:center;padding:22px;border-radius:26px;background:linear-gradient(135deg,#1c9bef,#0b6fc2 60%,#0a4f94);color:#fff;box-shadow:0 16px 30px -14px #0b6fc2}
.wxnow small{font-weight:800;opacity:.9}.wxnow b{display:block;font-size:56px;line-height:1;font-weight:900;margin:4px 0}.wxnow span{font-weight:700}
.wxnow i{font-style:normal;font-size:76px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.wxstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}

  function pushLayer(type) { stack.push(type); history.pushState({ l: stack.length }, ''); }

    if (t === 'ov') { const o = $('#overlay'); if (o) { o.classList.remove('open'); setTimeout(() => { o.innerHTML = ''; }, 250); } }

  /* ---------- photos ---------- */
  function photoUrl(c, i, w) {
    const f = c.photos[i]; if (!f) return '';
    if (/^(https?:|img\/)/.test(f)) return f;
    return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f)}?width=${w}`;
  }
  function photo(c, w, cls = '') {
    const width = S.settings.dataSaver ? Math.round(w / 2) : w;
    return `<div class="photo ${cls}" style="--g1:${c.grad[0]};--g2:${c.grad[1]}" data-emoji="${c.emoji}"><img src="${photoUrl(c, 0, width)}" alt="${esc(c.name)}" loading="lazy" decoding="async" data-crop="${c.id}" data-i="0" data-w="${width}"></div>`;
  }
  async function searchPhotos(c) {
    const k = 'pgn_ph_' + c.id; let list = store.get(k, null);
    if (list && list.length) return list;
    try {
      const q = encodeURIComponent((c.search || c.name) + ' filetype:bitmap');
      const r = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*`);
      const j = await r.json();
      list = Object.values((j.query && j.query.pages) || {}).sort((a, b) => a.index - b.index)
        .map((p) => p.imageinfo && p.imageinfo[0]).filter((i) => i && /jpeg/.test(i.mime) && i.thumburl).map((i) => i.thumburl);
      if (list.length) store.set(k, list);
    } catch { list = []; }
    return list || [];
  }
  document.addEventListener('error', async (e) => {
    const img = e.target; if (!img || img.tagName !== 'IMG' || !img.dataset.crop) return;
    const c = byId(img.dataset.crop); if (!c) return;
    if (img.dataset.s === undefined) {
      const i = +img.dataset.i + 1, u = photoUrl(c, i, img.dataset.w);
      if (u) { img.dataset.i = i; img.src = u; return; }
      img.dataset.s = '0';
    } else img.dataset.s = String(+img.dataset.s + 1);
    const list = await searchPhotos(c), u = list[+img.dataset.s];
    if (!img.isConnected) return;
    if (u) img.src = u; else { img.parentElement.classList.add('nophoto'); img.remove(); }

  const enc = new TextEncoder();
  const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function hashPw(pw, saltB64) {
    if (!(window.crypto && crypto.subtle)) return { salt: '', hash: 'x' + btoa(unescape(encodeURIComponent(pw))) };
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, key, 256);
    return { salt: b64(salt), hash: b64(bits) };
  }
  const pwRules = [
    ['At least 8 characters', (p) => p.length >= 8],
    ['An uppercase letter (A-Z)', (p) => /[A-Z]/.test(p)],
    ['A lowercase letter (a-z)', (p) => /[a-z]/.test(p)],
    ['A number (0-9)', (p) => /\d/.test(p)],
    ['A special character (! @ # $ ...)', (p) => /[^A-Za-z0-9]/.test(p)]
  ];
  const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  const phoneDigits = (v) => v.replace(/[\s\-()+]/g, '');
  const isPhone = (v) => /^\d{10,14}$/.test(phoneDigits(v));
  const contactKey = (v) => (isEmail(v) ? v.trim().toLowerCase() : phoneDigits(v).slice(-10));

    if (d < 0) label = 'Planting soon';
    else if (d >= c.days[0]) label = 'Ready to harvest';
    else if (f >= 0.7) label = 'Almost ready';
    else if (f >= 0.4) label = 'Growing strong';
    else if (f >= 0.12) label = 'Young plants';
    return { d: Math.max(d, 0), pct: Math.max(0, Math.min(100, (d / max) * 100)), label, left: Math.max(0, c.days[0] - d), ready: d >= c.days[0] };
  }

  async function doRegister(f, btn) {
    const v = Object.fromEntries(new FormData(f)); const errs = {};
    const name = (v.name || '').trim(), uname = (v.username || '').trim().toLowerCase(), contact = (v.contact || '').trim(), pw = v.password || '';
    if (name.length < 3 || !/[A-Za-z]/.test(name)) errs.name = 'Enter your full name';
    if (!/^[a-z0-9_.]{3,20}$/.test(uname)) errs.username = '3-20 letters, numbers, _ or .';
    if (!isEmail(contact) && !isPhone(contact)) errs.contact = 'Enter a valid email or phone number';
    const failed = pwRules.filter((r) => !r[1](pw));
    if (failed.length) errs.password = 'Password is not strong enough';
    const list = users();
    if (!errs.username && list.some((u) => u.username === uname)) errs.username = 'This username is taken';
    if (!errs.contact && list.some((u) => u.contactKey === contactKey(contact))) errs.contact = 'This email or phone is already registered';
    setErrors(f, errs); if (Object.keys(errs).length) return;
    btn.classList.add('busy');
    const h = await hashPw(pw);
    list.push({ name, username: uname, contact, contactKey: contactKey(contact), salt: h.salt, hash: h.hash, created: Date.now() });
    store.set('pgn_users', list); store.set('pgn_session', uname);

  async function saveReminder(f) {
    const v = Object.fromEntries(new FormData(f)), times = [];
    if (v.am) times.push(v.amt || '06:30'); if (v.pm) times.push(v.pmt || '17:30');
    if (!times.length) { toast('Pick morning or evening'); return; }
    const today = ymd(new Date()), list = getRem().filter((r) => r.cropId !== f.dataset.id);
    list.push({ id: 'r' + Date.now(), cropId: f.dataset.id, times: times.sort(), start: today, end: addDays(today, +v.len) });
    store.set(remKey(), list);
    let perm = 'unsupported';
    if ('Notification' in window) { perm = Notification.permission; if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch { /* ignore */ } } }
    closeTop(() => { updateBell(); toast(perm === 'granted' ? '✅ Reminder saved' : '✅ Saved. Turn on notifications in Profile to get alerts.'); if (S.tab === 'profile') renderView(); });
  }
  function showReminders() {
    const l = getRem();
    showSheet(`<h3 class="sheeth">🔔 My reminders</h3>${l.length ? l.map((r) => { const c = byId(r.cropId); return `<div class="remrow"><span>${c.emoji}</span><div><b>${esc(c.name)}</b><small>${r.times.join(' & ')} • until ${fmtDate(r.end)}</small></div><button class="x" data-act="delrem" data-id="${r.id}" aria-label="Delete">✕</button></div>`; }).join('') : '<p class="muted center">No reminders yet.<br>Open a crop and tap “Set Reminder to Water”.</p>'}`);
  }
  function updateBell() { const d = $('#bellDot'); if (d) d.hidden = !getRem().length; }

  const mins = (hm) => +hm.slice(0, 2) * 60 + +hm.slice(3, 5);
  function checkReminders() {
    if (!S.user) return;
    const now = new Date(), today = ymd(now), nm = now.getHours() * 60 + now.getMinutes();
    const fired = store.get('pgn_fired', {});
    getRem().forEach((r) => {
      if (today < r.start || today > r.end) return;
      r.times.forEach((t) => {
        const key = `${r.id}|${today}|${t}`, diff = nm - mins(t);
        if (fired[key] || diff < 0 || diff > 120) return;
        fired[key] = 1; const c = byId(r.cropId);
        notify(`💧 Time to water your ${c.name}`, t < '12:00' ? 'Good morning! Water your plants now.' : 'Good evening! Water your plants now.');
      });
    });
    const keep = {}; Object.keys(fired).forEach((k) => { if (k.split('|')[1] === today) keep[k] = 1; });
    store.set('pgn_fired', keep);
  }
  function notify(title, body) {
    toast(title);
    if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
      navigator.serviceWorker.getRegistration().then((reg) => reg && reg.showNotification(title, { body, icon: 'icon.svg', badge: 'icon.svg', tag: title, vibrate: [120, 60, 120] })).catch(() => {});
    }
  }

  /* ---------- WEATHER ---------- */
  const CITIES = { Lagos: [6.5244, 3.3792], Abuja: [9.0765, 7.3986], Kano: [12.0022, 8.592], Ibadan: [7.3775, 3.947], 'Port Harcourt': [4.8156, 7.0498], Enugu: [6.4584, 7.5464], Kaduna: [10.5105, 7.4165], Benin: [6.335, 5.6037], Jos: [9.8965, 8.8583], Ilorin: [8.4966, 4.5421], Maiduguri: [11.8311, 13.151], Sokoto: [13.0059, 5.2476], Owerri: [5.4836, 7.0333] };
  const WMO = (c) => (c === 0 ? ['☀️', 'Clear sky'] : c <= 2 ? ['⛅', 'Partly cloudy'] : c === 3 ? ['☁️', 'Cloudy'] : c <= 48 ? ['🌫️', 'Foggy or hazy'] : c <= 57 ? ['🌦️', 'Light drizzle'] : c <= 67 ? ['🌧️', 'Rain'] : c <= 82 ? ['🌦️', 'Rain showers'] : ['⛈️', 'Thunderstorm']);
  const wxPlace = () => store.get('pgn_wxplace', { name: 'Lagos', lat: 6.5244, lon: 3.3792 });
  function viewWeather() {
    const p = wxPlace();
    return `<section class="pagehead"><h2>Weather ⛅</h2><p>Plan your planting and watering.</p></section>
      <div class="wxbar"><label class="sel inline"><span>City</span><select id="city">${Object.keys(CITIES).map((n) => `<option ${n === p.name ? 'selected' : ''}>${n}</option>`).join('')}${p.name === 'My location' ? '<option selected>My location</option>' : ''}</select></label><button class="chip" data-act="geo">📍 Near me</button></div>
      <div id="wx"><div class="skeleton"></div></div>`;
  }
  async function loadWeather() {
    const p = wxPlace(), key = 'pgn_wx_' + p.name, box = $('#wx'); if (!box) return;
    const cached = store.get(key, null);
    if (cached && Date.now() - cached.t < 3600e3) { box.innerHTML = wxHtml(cached.d, p, cached.t, false); return; }
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=5`;
      const r = await fetch(u); if (!r.ok) throw 0; const d = await r.json();
      store.set(key, { t: Date.now(), d }); if ($('#wx')) $('#wx').innerHTML = wxHtml(d, p, Date.now(), false);
    } catch {
      if (cached) box.innerHTML = wxHtml(cached.d, p, cached.t, true);
      else box.innerHTML = `<div class="empty big"><span>📡</span><p><b>No internet</b><br>Connect once to load the weather.<br>We will save it for later.</p></div>`;
    }
  }
  function wxHtml(d, p, t, old) {
    const cur = d.current, dl = d.daily, [ic, desc] = WMO(cur.weather_code);
    const rain3 = dl.precipitation_sum.slice(0, 3).reduce((a, b) => a + b, 0), prob = dl.precipitation_probability_max[0];
    let adv = ['🚿', 'No rain soon', 'Water your crops in the morning and evening.'];
    if (rain3 > 25) adv = ['⚠️', 'Heavy rain is coming', 'Do not plant seeds now. They can rot. Check that water can drain out.'];
    else if (prob >= 60 || rain3 > 8) adv = ['🌧️', 'Rain is likely', 'Good time to plant. Skip watering when it rains.'];
    else if (prob >= 30) adv = ['🌤️', 'Maybe some rain', 'Plant, then water lightly. Check the sky in the evening.'];
    const day = (s) => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
    return `<div class="wxnow"><div><small>${esc(p.name)}</small><b>${Math.round(cur.temperature_2m)}°C</b><span>${desc}</span></div><i>${ic}</i></div>
      <div class="wxstats"><span>💧 ${cur.relative_humidity_2m}%<small>Humidity</small></span><span>💨 ${Math.round(cur.wind_speed_10m)} km/h<small>Wind</small></span><span>☔ ${prob ?? 0}%<small>Rain today</small></span></div>
      <div class="advice"><span>${adv[0]}</span><div><b>${adv[1]}</b><p>${adv[2]}</p></div></div>
      <div class="sec"><h2>Next 5 days</h2></div>
      <div class="fc">${dl.time.map((s, i) => `<div><b>${i ? day(s) : 'Today'}</b><i>${WMO(dl.weather_code[i])[0]}</i><span>${Math.round(dl.temperature_2m_max[i])}° / ${Math.round(dl.temperature_2m_min[i])}°</span><small>☔ ${dl.precipitation_probability_max[i] ?? 0}%</small></div>`).join('')}</div>
      <p class="muted small center">${old ? '📴 Offline. Showing saved weather from ' : 'Updated '}${new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}. Data: Open-Meteo.</p>`;
  }

    },

  document.addEventListener('click', (e) => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = actions[t.dataset.act]; if (fn) fn(t, e); });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
    const btn = $('button[type=submit]', f), k = f.dataset.form;
    if (k === 'login') doLogin(f, btn); else if (k === 'register') doRegister(f, btn); else if (k === 'reminder') saveReminder(f); else if (k === 'farm') saveFarm(f);
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'q') { S.q = t.value; $('#grid').innerHTML = gridHtml(); $('#count').textContent = filtered().length + ' crops'; }
    if (t.id === 'password' && t.closest('[data-form=register]')) {
      const p = t.value, ok = pwRules.map((r) => r[1](p)), n = ok.filter(Boolean).length, f = t.closest('form');
      $$('.rules li', f).forEach((li, i) => li.classList.toggle('ok', ok[i]));
      $$('.meter i', f).forEach((b, i) => { b.className = i < n ? 'on l' + n : ''; });
    }
    const fl = t.closest('.fld'); if (fl && fl.classList.contains('bad')) { fl.classList.remove('bad'); const er = $('.err', fl); if (er) er.textContent = ''; }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'city') { const n = t.value; if (CITIES[n]) store.set('pgn_wxplace', { name: n, lat: CITIES[n][0], lon: CITIES[n][1] }); $('#wx').innerHTML = '<div class="skeleton"></div>'; loadWeather(); }
    if (t.dataset && t.dataset.set) { S.settings[t.dataset.set] = t.checked; store.set('pgn_settings', S.settings); toast(t.checked ? 'Data saver on 📶' : 'Data saver off'); }
  });

  /* ======================================================
     START
     ====================================================== */
  function init() {
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
    const name = store.get('pgn_session', null);
    S.user = name ? users().find((u) => u.username === name) || null : null;
    if (S.user) renderShell(); else renderAuth();
    checkReminders();
    setInterval(checkReminders, (CFG.reminderCheckEvery || 30) * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
  }
  init();
})();


</script>
</body>
</html>
